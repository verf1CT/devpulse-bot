version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: devpulse
      POSTGRES_PASSWORD: devpulse_password
      POSTGRES_DB: devpulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  bot:
    build: .
    restart: always
    env_file: .env
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DATABASE_URL: postgresql+asyncpg://devpulse:devpulse_password@db/devpulse
    depends_on:
      - db
    volumes:
      - .:/app

  web:
    build: .
    command: uvicorn src.web:app --host 0.0.0.0 --port 8000 --reload
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://devpulse:devpulse_password@db/devpulse
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
